<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAPLY</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 40px 20px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            margin-top: 20px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            padding: 16px;
            margin: 12px 0;
            background: white;
            color: #222;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }

        .review {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <img id="logo" class="logo">

    <h1 id="nom"></h1>

    <p id="description" class="description"></p>

    <a id="google" class="button review" target="_blank">
        ⭐ Laisser un avis Google
    </a>

    <a id="telephone" class="button">
        📞 Appeler
    </a>

    <a id="instagram" class="button" target="_blank">
        📷 Instagram
    </a>

    <a id="maps" class="button" target="_blank">
        📍 Nous trouver
    </a>

    <a id="site" class="button" target="_blank">
        🌐 Site web
    </a>

    <p>Powered by TAPLY</p>

</div>

<script src="clients.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const client = clients[id];

if (client) {

    document.getElementById("logo").src = client.logo;

    document.getElementById("nom").textContent = client.nom;

    document.getElementById("description").textContent =
        client.description;

    document.getElementById("google").href =
        client.google;

    document.getElementById("telephone").href =
        "tel:" + client.telephone;

    document.getElementById("instagram").href =
        client.instagram;

    document.getElementById("maps").href =
        client.maps;

    document.getElementById("site").href =
        client.site;

} else {

    document.querySelector(".container").innerHTML =
        "<h1>Commerce introuvable</h1>" +
        "<p>Identifiant TAPLY incorrect.</p>";
}

</script>

</body>
</html>
